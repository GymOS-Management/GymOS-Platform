name: CI

on:
  push:
    # Two long-lived branches. The model is feature/* -> development -> main: development is where
    # work actually lands, main is the last place a break should be discovered. Running only on main
    # meant an increment could sit on development for days, fully merged, with CI never having seen
    # it — which is precisely what happened to F4's twenty commits.
    #
    # `staging` was the third and is retired, matching GymOS-Backend. It was a promotion step nothing
    # was ever promoted through — it last moved on 12 August — and leaving CI pointed at it means a
    # permanently red build: this job checks out GymOS-Backend's default branch, which is now on SQL
    # Server, so a stale Platform branch is tested against a backend it cannot talk to. The ref still
    # exists; it is simply no longer part of the flow.
    branches: [main, development]
  pull_request:

jobs:
  # Static gates: fast, no services, and they catch the things a browser never would.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No version pinned here on purpose: action-setup reads `packageManager` from package.json,
      # so CI uses the same pnpm as developers — and therefore enforces the same supply-chain
      # policy. Pinning 9 here previously meant CI could not see a minimumReleaseAge violation.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Dependency policy
        run: node scripts/check-dependencies.mjs

      - name: Types match the committed API contract
        # The generated types are checked in, so drift between them and the backend's contract is
        # visible in review rather than discovered at runtime (AD-12). Regenerate with `pnpm gen:api`.
        run: |
          if [ -f ../GymOS-Backend/contracts/openapi-v1.json ]; then
            pnpm gen:api
            git diff --exit-code src/types/api.d.ts
          else
            echo "Backend contract not checked out; skipping drift check."
          fi

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  # The journey against a real backend and a real database. Separate job: it needs services and
  # minutes, and a failure here means something different from a failing unit test.
  e2e:
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: Gymos_ci_sa_password1
          MSSQL_PID: Developer
          # Must match what the backend's 00-database.sql creates, or every temp-table join hits a
          # collation conflict against tempdb.
          MSSQL_COLLATION: Latin1_General_100_CI_AS
        ports: ['1433:1433']
        # A real query rather than a port probe: the engine accepts TCP seconds before it will answer
        # one, and the init step below connects the moment this reports healthy. `--health-start-period`
        # is what the PostgreSQL service did not need — SQL Server creates its system databases on
        # first boot and is not answerable for roughly half a minute.
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Gymos_ci_sa_password1 -C -b -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 5s --health-retries 12 --health-start-period 45s
    steps:
      - name: Check out the console
        uses: actions/checkout@v4
        with:
          path: GymOS-Platform

      - name: Check out the backend
        uses: actions/checkout@v4
        with:
          repository: GymOS-Management/GymOS-Backend
          path: GymOS-Backend

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      # No version pinned here on purpose: action-setup reads `packageManager` from package.json,
      # so CI uses the same pnpm as developers — and therefore enforces the same supply-chain
      # policy. Pinning 9 here previously meant CI could not see a minimumReleaseAge violation.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: GymOS-Platform/pnpm-lock.yaml

      # The database, the two principals and the two schemas — the work the `db-init` compose service
      # does for the containerised stack, done here with the same scripts so the two cannot drift.
      #
      # This step has no counterpart in the PostgreSQL version, which needed none: the `postgres`
      # service created its database and role from environment variables, and the API connected as
      # that single superuser-ish role. It cannot work that way now, and not for a cosmetic reason —
      # TenantIsolationValidator refuses to boot a host whose principal holds
      # ALTER ANY SECURITY POLICY, which `sa` does. An E2E job that connected as `sa` would fail at
      # startup, so the two-principal split is load-bearing here exactly as it is in production.
      #
      # sqlcmd comes from the image rather than being installed on the runner: `docker run` against
      # the host network reaches the service container's published port with no extra tooling.
      - name: Initialise the database
        working-directory: GymOS-Backend
        run: |
          set -euo pipefail
          for script in docker/sqlserver/initdb/*.sql; do
            echo "db-init: applying ${script}"
            docker run --rm --network host \
              -v "$PWD/docker/sqlserver/initdb:/initdb:ro" \
              mcr.microsoft.com/mssql/server:2022-latest \
              /opt/mssql-tools18/bin/sqlcmd \
                -S localhost,1433 -U sa -P 'Gymos_ci_sa_password1' -C -b \
                -v GYMOS_DB=gymos \
                -v GYMOS_MIGRATOR_PASSWORD='Gymos_ci_migrator_password1' \
                -v GYMOS_APP_PASSWORD='Gymos_ci_app_password1' \
                -i "/initdb/$(basename "$script")"
          done

      # Migrations as the migrator, then the API as the app principal — the deployment's split, run
      # as two steps here instead of two containers. Database:MigrateOnly makes the host apply
      # migrations and exit, which is exactly what the `migrator` compose service does.
      - name: Apply migrations
        working-directory: GymOS-Backend
        env:
          ASPNETCORE_ENVIRONMENT: Development
          Database__MigrateOnly: 'true'
          ConnectionStrings__Database: Server=localhost,1433;Database=gymos;User Id=gymos_migrator;Password=Gymos_ci_migrator_password1;Encrypt=True;TrustServerCertificate=True;Current Language=us_english
        run: dotnet run --project src/Host/GymOS.WebApi

      - name: Start the API
        working-directory: GymOS-Backend
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://localhost:5080
          # gymos_app, not sa: see the initialise step. TrustServerCertificate because the container
          # presents a self-signed one; Current Language because UnitOfWork parses constraint names
          # out of the server's error messages and SQL Server localises them.
          ConnectionStrings__Database: Server=localhost,1433;Database=gymos;User Id=gymos_app;Password=Gymos_ci_app_password1;Encrypt=True;TrustServerCertificate=True;Current Language=us_english
          # Applied by the step above, as the principal that is allowed to. gymos_app holds no DDL.
          Database__MigrateOnStartup: 'false'
          Seed__SuperAdmin__Email: e2e@gymos.test
          Seed__SuperAdmin__Password: e2e-super-admin-password
          # See tests/e2e/README.md: every test signs in fresh, which is more than the
          # production-appropriate limit allows. Raised on the test instance only.
          Security__RateLimiting__SignInAttemptsPerWindow: '500'
        run: |
          dotnet run --project src/Host/GymOS.WebApi &
          for i in $(seq 1 90); do
            if curl -sf http://localhost:5080/health/ready > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "API did not become ready" && exit 1

      - name: Install and run
        working-directory: GymOS-Platform
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: GymOS-Platform/playwright-report/
          retention-days: 7
